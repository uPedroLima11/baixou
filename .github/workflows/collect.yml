name: Atualizar ofertas
on:
  schedule:
    # A cada 15 min, fora do minuto 0 e dos lotes Vercel (:00/:15/:30/:45). Alterar a linha re-registra o agendamento no GitHub.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
concurrency:
  group: baixou-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        store: [kabum, waz, guerradigital, patoloco]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECT_STORES: ${{ matrix.store }}
      COLLECT_MAX_PRODUCTS: 60
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Descoberta autorizada
        run: npm run discover:social
      - name: Resolver links candidatos
        run: npm run discover
      - name: Confirmar preços e estoque nas lojas
        run: npm run collect
      - name: Enviar alertas opt-in
        run: npm run notifications

      - name: Relatório real de cobertura
        if: always()
        run: npm run collect:report
