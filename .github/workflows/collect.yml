name: Atualizar ofertas
on:
  schedule:
    # A cada 15 min, fora do minuto 0 e dos lotes Vercel (:00/:15/:30/:45). Alterar a linha re-registra o agendamento no GitHub.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
concurrency:
  group: baixou-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        # KaBuM tem ciclo próprio (collect-kabum.yml) desde 26/11/2026: o job longo dela esticava esta rodada.
        store: [waz, guerradigital, patoloco, ibyte, chipart, shopinfo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECT_STORES: ${{ matrix.store }}
      # WAZ (26/11 20h24): 510 vivas, 116 vencidas com 200/330 s; mesmo ritmo por requisição, só por mais tempo.
      COLLECT_MAX_PRODUCTS: ${{ matrix.store == 'waz' && 270 || 200 }}
      COLLECT_DEADLINE_MS: ${{ matrix.store == 'waz' && 450000 || 330000 }}
      COLLECT_DISCOVERY_PAGES: 3
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Descoberta autorizada
        run: npm run discover:social
      - name: Resolver links candidatos
        # Mesma nova tentativa para 5xx transitório do gateway Supabase (Cloudflare 5xx em 45307793055, Guerra).
        run: npm run discover || { echo "Nova tentativa em 45 s"; sleep 45; npm run discover; }
      - name: Confirmar preços e estoque nas lojas
        # Até duas novas tentativas (45 s e 90 s): episódios de 522 do gateway Supabase duraram >1 min em 23/11 (rodada 21:31 UTC).
        # Antes: uma nova tentativa para 5xx transitório do gateway Supabase (Cloudflare 522 em 45199413698 e na rodada de e17a6ff).
        # Idempotente: lease por loja; falha persistente continua vermelha.
        run: npm run collect || { echo "Nova tentativa em 45 s"; sleep 45; npm run collect; } || { echo "Última tentativa em 90 s"; sleep 90; npm run collect; }
      - name: Enviar alertas opt-in
        run: npm run notifications
      - name: Descobrir os mesmos modelos em outras lojas (HTML público)
        if: matrix.store == 'patoloco' || matrix.store == 'ibyte' || matrix.store == 'shopinfo' || matrix.store == 'chipart'
        env:
          TARGETED_MAX: '3'
          TARGETED_DEADLINE_MS: '20000'
        run: npm run discover:targeted

  # Conectores independentes (lib/connectors), em paralelo à matriz: hoje só as vitrines de lojas oficiais do
  # Mercado Livre (~25 requisições por execução). Desligar com a variável de repositório ML_STOREFRONTS=off.
  connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ML_STOREFRONTS: ${{ vars.ML_STOREFRONTS }}
      # Prazo total dos conectores (máximo aceito pelo script: 300 s). Canais do Telegram + vitrines do ML.
      CONNECTOR_DEADLINE_MS: 300000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Conectores (canal oficial Terabyte no Telegram + lojas oficiais do Mercado Livre)
        # Mesma nova tentativa única da coleta para 5xx transitório do gateway Supabase (Cloudflare 522 em 45255... de 23/11).
        run: npm run connectors || { echo "Nova tentativa em 45 s"; sleep 45; npm run connectors; } || { echo "Última tentativa em 90 s"; sleep 90; npm run connectors; }

  # Relatório único depois das quatro lojas (antes rodava 4x por execução). Uma nova tentativa cobre
  # erros transitórios do gateway Supabase (ex.: Cloudflare 522 observado em 45199413698); falha persistente fica vermelha.
  report:
    needs: [collect, connectors]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Referência de preço de mercado (mesmo produto em outras lojas)
        run: npm run market:refresh || { echo "Nova tentativa em 30 s"; sleep 30; npm run market:refresh; }
      - name: Relatório real de cobertura
        if: always()
        run: npm run collect:report || { echo "Nova tentativa em 30 s"; sleep 30; npm run collect:report; }

  # O GitHub não entregou nenhum evento schedule para este repositório (zero desde 23/11/2026 03:35 UTC,
  # inclusive após re-registrar o cron). Revezamento: cada execução agenda a próxima com o GITHUB_TOKEN
  # efêmero (workflow_dispatch é a exceção documentada que cria nova execução). Cadência ~15 min (coleta ~6 min + 7 min).
  # Parar: variável de repositório COLLECT_RELAY=off. Se o schedule voltar a disparar, o revezamento para sozinho.
  # Execuções duplicadas colapsam: o grupo de concorrência mantém uma só pendente.
  relay:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && vars.COLLECT_RELAY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Aguardar próxima janela e despachar coleta
        run: |
          # Só encerra se o agendamento nativo estiver REGULAR: 2+ execuções "schedule" nos últimos 50 min.
          # (Em 24/11 um único evento às 01:51 encerrou o revezamento e o schedule não voltou: ~1 h sem coleta.)
          since=$(date -u -d '50 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow collect.yml --event schedule --limit 5 --json createdAt --jq "[.[]|select(.createdAt>\"$since\")]|length")
          if [ "${count:-0}" -ge 2 ]; then
            echo "Agendamento nativo regular ($count execuções em 50 min); revezamento encerrado."; exit 0
          fi
          # 300 s (era 420): compensa o job mais longo da WAZ; ciclo comum ~14 min.
          sleep 300
          gh workflow run collect.yml --ref main
          echo "Próxima coleta despachada às $(date -u +%H:%M:%S) UTC."
