name: Atualizar ofertas
on:
  schedule:
    # A cada 15 min, fora do minuto 0 e dos lotes Vercel (:00/:15/:30/:45). Alterar a linha re-registra o agendamento no GitHub.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
concurrency:
  group: baixou-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        store: [kabum, waz, guerradigital, patoloco]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECT_STORES: ${{ matrix.store }}
      COLLECT_MAX_PRODUCTS: 60
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Descoberta autorizada
        run: npm run discover:social
      - name: Resolver links candidatos
        run: npm run discover
      - name: Confirmar preços e estoque nas lojas
        run: npm run collect
      - name: Enviar alertas opt-in
        run: npm run notifications

      - name: Relatório real de cobertura
        if: always()
        run: npm run collect:report

  # O GitHub não entregou nenhum evento schedule para este repositório (zero desde 23/11/2026 03:35 UTC,
  # inclusive após re-registrar o cron). Revezamento: cada execução agenda a próxima com o GITHUB_TOKEN
  # efêmero (workflow_dispatch é a exceção documentada que cria nova execução). Cadência ~15 min.
  # Parar: variável de repositório COLLECT_RELAY=off. Se o schedule voltar a disparar, o revezamento para sozinho.
  # Execuções duplicadas colapsam: o grupo de concorrência mantém uma só pendente.
  relay:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && vars.COLLECT_RELAY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Aguardar próxima janela e despachar coleta
        run: |
          recent=$(gh run list --workflow collect.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$recent" ] && [ $(( $(date +%s) - $(date -d "$recent" +%s) )) -lt 2700 ]; then
            echo "Agendamento nativo ativo ($recent); revezamento encerrado."; exit 0
          fi
          sleep 540
          gh workflow run collect.yml --ref main
          echo "Próxima coleta despachada às $(date -u +%H:%M:%S) UTC."
