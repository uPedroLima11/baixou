project_id = "baixou"
[auth]
enabled = true
site_url = "https://baixouofertas.vercel.app"
additional_redirect_urls = ["https://baixouofertas.vercel.app/auth/callback", "https://baixouofertas.vercel.app/auth/reset", "https://baixou-iota.vercel.app/auth/callback", "https://baixou-iota.vercel.app/auth/reset", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/reset"]
minimum_password_length = 10
[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true



[auth.email.template.confirmation]
subject = "Baixou! — confirme seu cadastro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Baixou! — redefina sua senha"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Baixou! — seu convite chegou"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Baixou! — seu link de acesso"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Baixou! — confirme a alteração de e-mail"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Baixou! — confirme sua identidade"
content_path = "./supabase/templates/reauthentication.html"
